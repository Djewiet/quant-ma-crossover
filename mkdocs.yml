site_name: quant-ma-crossover
site_description: Backtest du croisement SMA 50/200 sur BTC et le S&P 500, avec une hygiène de données de niveau production.
site_url: https://djewiet.github.io/quant-ma-crossover/
repo_url: https://github.com/Djewiet/quant-ma-crossover
repo_name: Djewiet/quant-ma-crossover
edit_uri: edit/main/docs/
copyright: Recherche et pédagogie uniquement. Aucune promesse de rendement.

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode clair

nav:
  - Accueil: index.md
  - Données de marché: donnees-de-marche.md
  - Référence API:
      - Vue d'ensemble: reference/index.md
      - Configuration: reference/config.md
      - Données: reference/data.md

plugins:
  - search:
      lang: fr
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
