[project]
name = "quant-ma-crossover"
version = "0.1.0"
description = "SMA 50/200 crossover backtest on BTC and the S&P 500, built with production-grade data hygiene."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "yfinance>=0.2.54",
]

[project.scripts]
ma-crossover = "ma_crossover.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ma_crossover"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PD", "NPY"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits a real data provider (run with: pytest -m network)"]
